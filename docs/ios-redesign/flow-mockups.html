<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tübingen student companion · Flow mockups</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 960px; margin: auto; }
  h1 { font-size: clamp(1.65rem, 4vw, 2.3rem); line-height: 1.12; letter-spacing: -.045em; margin: 8px 0; }
  .intro { margin: 0 0 16px; color: var(--muted-foreground, #655e5b); font-size: .875rem; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .journeys { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .journeys button, .step, .pager button {
    background: transparent; color: inherit; border: 1px solid var(--border, #c9c1bc);
    border-radius: 10px; padding: 6px 10px; min-height: 36px; font-size: .8125rem;
  }
  .journeys [aria-pressed="true"], .step[aria-current="step"] {
    background: var(--foreground, #24201e); color: var(--background, #fff); border-color: transparent;
  }
  .gallery { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: clamp(12px, 4vw, 32px); align-items: start; }
  .guide h2 { margin: 0 0 4px; letter-spacing: -.03em; font-size: 1.2rem; }
  .guide p { margin: 0 0 12px; font-size: .875rem; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .step { text-align: left; }
  .phone {
    --paper: #fff; --ink: #211c1c; --muted-ink: #665d59; --line: #e8e3e0;
    --accent: #9e2037; --fill: #f6f2ef; --alert: #f9eef0; --alert-ink: #77273a;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line);
    border-radius: 24px; display: flex; flex-direction: column; min-height: 492px; overflow: hidden;
  }
  .glass { padding: 18px clamp(16px, 4vw, 22px) 20px; flex: 1; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; min-height: 33px; margin-bottom: 16px; }
  .toolbar button, .text-action { color: var(--accent); background: none; border: 0; padding: 0; font-size: .8125rem; font-weight: 650; min-height: 36px; }
  .context, .meta { color: var(--muted-ink); font-size: .8125rem; }
  .app-title { font-size: 1.95rem; font-weight: 730; letter-spacing: -.045em; line-height: 1.05; margin: 4px 0 8px; overflow-wrap: anywhere; }
  .group { margin-top: 19px; margin-bottom: 5px; font-weight: 700; font-size: .875rem; }
  .card { margin-top: 13px; border-radius: 14px; padding: 12px 14px; background: var(--fill); }
  .card + .row, .card + button.row { border-top: 0; }
  .card.hero { background: #9e2037; color: #fff; }
  .card.alert { background: var(--alert); color: var(--alert-ink); }
  .card .meta { color: inherit; margin-top: 3px; }
  .card.hero .meta { color: #f8dce3; }
  .row, .field {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; color: inherit; border: 0; border-top: 1px solid var(--line);
    padding: 10px 0; min-height: 47px; font-size: .875rem;
  }
  button.row:hover, .toolbar button:hover, .text-action:hover { color: var(--accent); }
  .row .meta { display: block; margin-top: 2px; font-size: .75rem; }
  .row .arrow { margin-left: auto; color: var(--muted-ink); flex: none; }
  .cancelled strong { text-decoration: line-through; }
  .primary { display: block; width: 100%; margin-top: 14px; padding: 10px 14px; min-height: 44px; border: 0; border-radius: 11px; background: #9e2037; color: white; font-size: .875rem; font-weight: 700; }
  .text-action { margin-top: 6px; }
  .field { display: block; border: 0; padding-bottom: 0; color: var(--muted-ink); font-size: .75rem; }
  .field span { display: block; margin-top: 4px; border-radius: 9px; padding: 10px 12px; color: var(--ink); background: var(--fill); font-size: .875rem; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
  .tabs button { padding: 11px 2px; min-height: 44px; border: 0; background: none; color: var(--muted-ink); font-size: .75rem; font-weight: 630; }
  .tabs [aria-current="page"] { color: var(--accent); }
  .pager { display: flex; justify-content: space-between; gap: 8px; margin-top: 9px; }
  .pager button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 575px) { .gallery { grid-template-columns: 1fr; gap: 14px; } .guide { order: 1; } .phone { min-height: 430px; } }
  @media (prefers-color-scheme: dark) {
    .phone { --paper: #211e1d; --ink: #f4efed; --muted-ink: #c3b9b4; --line: #423b38;
      --accent: #ffc0cc; --fill: #302a28; --alert: #46252c; --alert-ink: #f7c9d2; }
    .intro { color: var(--muted-foreground, #c3b9b4); }
    .journeys [aria-pressed="true"], .step[aria-current="step"] {
      background: var(--foreground, #f4efed); color: var(--background, #211e1d);
    }
  }
</style>
</head>

const entries = new Map(flows.flatMap(([, , screens], flow) =>
  Object.entries(screens).map(([id, screen]) => [id, { flow, screen }])));
const tabs = [["Today", "today"], ["Schedule", "schedule"], ["Courses", "courses"], ["Campus", "campus"]];
const byId = id => document.getElementById(id);
const go = (label, target, attrs = "") => `<button type="button" data-go="${target}" ${attrs}>${label}</button>`;

function component(line) {
  const [kind, title, detail, target] = line.split("|");
  if (kind === "group") return `<div class="group">${title}</div>`;
  if (kind === "field") return `<div class="field">${title}<span>${detail}</span></div>`;
  if (kind === "link") return go(title, detail, 'class="text-action"');
  if (kind === "primary") return go(title, detail, 'class="primary"');
  const copy = `<span><strong>${title}</strong>${detail ? `<span class="meta">${detail}</span>` : ""}</span>`;
  if (kind === "row" || kind === "cancel") {
    const classes = kind === "cancel" ? "row cancelled" : "row";
    return target
      ? go(copy + '<span class="arrow" aria-hidden="true">›</span>', target, `class="${classes}"`)
      : `<div class="${classes}">${copy}</div>`;
  }
  return `<div class="card ${kind}"><strong>${title}</strong><div class="meta">${detail}</div></div>`;
}

let current;
const history = [];
function show(id, focus = false, remember = true) {
  if (!entries.has(id)) return;
  if (remember && current && current !== id) history.push(current);
  current = id;
  const { flow, screen: [title, context, tab, content] } = entries.get(id);
  const [name, note, screens] = flows[flow];
  const ids = Object.keys(screens);
  const position = ids.indexOf(id);
  byId("journeys").innerHTML = flows.map(([label, , states], index) =>
    go(label, Object.keys(states)[0], `aria-pressed="${flow === index}"`)).join("");
  byId("flow-title").textContent = name;
  byId("flow-note").textContent = note;
  byId("steps").innerHTML = ids.map(key => go(screens[key][0], key,
    `class="step"${key === id ? ' aria-current="step"' : ""}`)).join("");
  const toolbar = `<div class="toolbar">${history.length ? go("‹ Back", "back") : "<span></span>"}${id !== "account" ? go("Account", "account") : ""}</div>`;
  const navigation = tab
    ? `<nav class="tabs" aria-label="App tabs">${tabs.map(([label, key]) =>
      go(label, key, label === tab ? 'aria-current="page"' : "")).join("")}</nav>` : "";
  byId("phone").innerHTML = `<div class="glass">${toolbar}<div class="context">${context}</div>
    <div class="app-title" id="app-title" role="heading" aria-level="3" tabindex="-1">${title}</div>
    ${content.split(";").map(component).join("")}</div>${navigation}`;
  for (const [button, target] of [["prev", ids[position - 1]], ["next", ids[position + 1]]]) {
    byId(button).disabled = !target;
    byId(button).onclick = () => show(target, true);
  }
  if (focus) byId("app-title").focus({ preventScroll: true });
}

document.addEventListener("click", event => {
  const control = event.target.closest("[data-go]");
  if (control?.dataset.go === "back") show(history.pop(), true, false);
  else if (control) show(control.dataset.go, true);
});
show("today");
</script>
</body>
</html>
